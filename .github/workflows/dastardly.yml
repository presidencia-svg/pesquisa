# Dastardly (PortSwigger) DAST scanner
#
# Roda o scanner de PortSwigger Burp Suite contra a app, mensalmente +
# sob demanda. Cobre 7 classes de issue (XSS, header injection,
# mixed content, etc) em ROTAS PÚBLICAS.
#
# IMPORTANTE — Escopo do scan:
#   ✓ Cobertas:    /, /transparencia, /resultados, /privacidade,
#                  /privacidade/excluir, /api/biografia, /admin/login,
#                  /.well-known/security.txt
#   ✗ Fora:        /votar, /votar/confirma, /votar/otp, /votar/cedula/*
#                  → Bloqueadas por Cloudflare Turnstile, que o scanner
#                  não resolve. Fluxo de voto é coberto via white-box no
#                  pentest interno (docs/confidencial/pentest-2026-05-*).
#
# Por que NÃO escanear pesquisa.cdlaju.com.br diretamente?
#   O domínio público fica atrás do Cloudflare, que bloqueia o UA do
#   Dastardly e os IPs do GitHub Actions runners (testado: 1ª execução
#   retornou "Could not connect to any start URLs" mesmo com prod
#   respondendo 200 pra browser real).
#
#   Solução: escanear pesquisa-lovat.vercel.app, alias estável do Vercel
#   que serve a MESMA app (mesmo deploy, mesmo bundle), sem o CDN+WAF
#   na frente. Isso testa exatamente o que queremos — defeitos da
#   aplicação — em vez do comportamento do Cloudflare. O Cloudflare
#   continua sendo defesa-em-profundidade adicional contra atacantes
#   reais.
#
# O Dastardly NÃO suporta headers/cookies customizados (apenas
# target-url e output-filename). Tentar fazer bypass do Turnstile via
# env distorceria a postura de segurança real.
#
# O scanner é DAST ativo — manda payloads contra o domínio. Por isso:
#   - schedule mensal evita spam de logs
#   - workflow_dispatch deixa rodar sob demanda quando necessário
#   - artifact XML fica 30d pra inspeção

name: Dastardly DAST scan

on:
  # Permite disparar manualmente quando precisar de evidência atualizada
  workflow_dispatch:
    inputs:
      target:
        description: 'URL alvo (default: alias Vercel sem Cloudflare)'
        required: false
        default: 'https://pesquisa-lovat.vercel.app'
  # Mensal, primeiro dia, 03h UTC = 00h Brasília
  schedule:
    - cron: '0 3 1 * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write     # action-junit-report precisa pra criar check
    steps:
      - name: Run Dastardly Action
        continue-on-error: true   # não derruba o workflow se achar issue
        uses: PortSwigger/dastardly-github-action@main
        with:
          target-url: ${{ github.event.inputs.target || 'https://pesquisa-lovat.vercel.app' }}
          output-filename: dastardly-report.xml

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dastardly-report
          path: dastardly-report.xml
          retention-days: 30

      # Publica resumo no Job Summary do Actions UI pra leitura rápida
      # sem precisar baixar o XML.
      - name: Publish JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: dastardly-report.xml
          check_name: Dastardly
          fail_on_failure: false
          require_tests: false
